# Hexo Configuration
# 迁移自 VitePress：Ziogn Notes —— 个人技术文档知识库

## Site
title: Ziogn Notes
subtitle: 个人技术文档知识库
description: 个人技术文档知识库：AI/Go/Java/云原生/DevOps 技术调研与知识规划
keywords:
  - blog
  - 技术博客
  - AI
  - Go
  - Java
  - 云原生
author: ziogn
language: zh-CN
timezone: Asia/Shanghai

## URL
url: https://ziogn.github.io
root: /
permalink: :name/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

## Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

## Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude:
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

## Category & Tag
default_category: uncategorized
category_map:
tag_map:

## Metadata elements
meta_generator: true

## Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: mtime

## Pagination
per_page: 10
pagination_dir: page

## Include / Exclude file(s)
include:
exclude:
ignore:

## Extensions
theme: butterfly

## Deployment（本地备选；线上由 GitHub Actions 部署）
deploy:
  type: git
  repo: https://github.com/ziogn/ziogn.github.io.git
  branch: gh-pages
  message: "deploy: {{ now('YYYY-MM-DD HH:mm:ss') }}"

## Search（hexo-generator-search → search.xml，供 Butterfly local_search 使用）
search:
  path: search.xml
  field: post
  content: true
  format: html
  limit: 10000